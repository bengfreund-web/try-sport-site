name: Update impact data from sheet

on:
  schedule:
    - cron: '0 9 * * *'   # daily ~02:00-03:00 Mountain
  workflow_dispatch:        # allow manual runs

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate impact data from the sheet
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          if [ -z "$SHEET_CSV_URL" ]; then
            echo "::warning::SHEET_CSV_URL secret is not set — skipping data refresh, redeploying current site."
            exit 0
          fi
          python scripts/build_impact_data.py

      - name: Commit if the data changed
        run: |
          if [ -n "$(git status --porcelain impact/index.html)" ]; then
            git config user.name "impact-data-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add impact/index.html
            git commit -m "Auto-update impact data from master sheet"
            git push
            echo "Committed a data update."
          else
            echo "No data change."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
